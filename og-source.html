<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muaz Husaini — Open Graph card (1200x630)</title>
<style>
  /* Render source for og-card.png (1200x630). Reproduce with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --window-size=1200,630 --default-background-color=00000000 --hide-scrollbars \
       --screenshot="/Users/muazhusaini/Documents/Project/portfolio/og-card.png" \
       --virtual-time-budget=3000 \
       "file:///Users/muazhusaini/Documents/Project/portfolio/og-source.html" */

  @font-face {
    font-family: "General Sans";
    src: url("fonts/GeneralSans-Variable.woff2") format("woff2");
    font-weight: 200 700;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/JetBrainsMono-Medium.woff2") format("woff2");
    font-weight: 500;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Exa waves from the corner. Kept clear of the headline and the stat row so
     nothing collides when a client crops the card.

     Renders from assets/mascots/exa-source.png (614x840) rather than the
     300px exa.png the page uses, so re-running the headless render always
     produces a crisp card. */
  .og-exa {
    position: absolute;
    right: 52px;
    bottom: 58px;
    height: 232px;
    width: auto;
  }

  html, body {
    width: 1200px;
    height: 630px;
    margin: 0;
    overflow: hidden;
  }

  body {
    background: #FAFAF9;
    color: #17171A;
    font-family: "General Sans", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 84px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 40px;
    height: 2px;
    background: #17171A;
  }

  h1 {
    margin-top: 46px;
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -0.045em;
    line-height: 0.98;
  }
  .sig { color: #E9530E; }

  .sub {
    margin-top: 32px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    color: #54545C;
  }

  .rule {
    margin-top: 52px;
    height: 1px;
    background: #E6E6E4;
  }

  .stats {
    margin-top: 50px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start;
    gap: 48px;
  }
  .stats .val {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
  }
  .stats .cap {
    margin-top: 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.5;
    color: #54545C;
  }
</style>
</head>
<body>
  <img class="og-exa" src="assets/mascots/exa-source.png" alt="">
  <p class="eyebrow">AI Engineer</p>

  <h1>I build AI agents that are<br><span class="sig">checked</span> before anyone<br>sees the answer.</h1>

  <p class="sub">Muaz Husaini &middot; Data &amp; AI DevOps @ Maxis &middot; Kuala Lumpur</p>

  <div class="rule"></div>

  <div class="stats">
    <div>
      <p class="val">4,000+</p>
      <p class="cap">verified answers in production</p>
    </div>
    <div>
      <p class="val">2.4x</p>
      <p class="cap">answered-question growth in one quarter</p>
    </div>
    <div>
      <p class="val">190+</p>
      <p class="cap">tests behind one agent</p>
    </div>
  </div>
</body>
</html>
