<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in space — Muaz Husaini</title>
  <meta name="description" content="That page does not exist. Naro is looking for it.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FAFAF9">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
  <link rel="preload" href="fonts/GeneralSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    .lost {
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: clamp(32px, 6vw, 96px);
      padding-block: clamp(48px, 10vh, 120px);
    }
    .lost-code {
      font-family: var(--mono);
      font-size: 0.6875rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--graphite);
    }
    .lost h1 {
      margin-top: 1.25rem;
      font-size: clamp(2.25rem, 6vw, 4.25rem);
      font-weight: 680;
      line-height: 1.02;
      letter-spacing: -0.035em;
    }
    .lost p {
      margin-top: 1.5rem;
      max-width: 34ch;
      font-size: clamp(1rem, 1.5vw, 1.125rem);
      color: var(--graphite);
    }
    .lost-back {
      display: inline-block;
      margin-top: 2.25rem;
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }
    .lost-back:hover { color: var(--signal); }
    .adrift {
      height: clamp(180px, 34vh, 380px);
      width: auto;
      justify-self: end;
      animation: drift 9s ease-in-out infinite;
    }
    @keyframes drift {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-3deg); }
      50%      { transform: translate3d(-10px, -18px, 0) rotate(4deg); }
    }
    @media (max-width: 720px) {
      .lost { grid-template-columns: 1fr; justify-items: start; }
      .adrift { justify-self: start; order: -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .adrift { animation: none; }
    }
  </style>
</head>
<body>
  <header class="site-head">
    <div class="wrap head-row">
      <a class="brand" href="/">Muaz Husaini</a>
      <nav aria-label="Sections">
        <a href="/#work">Work</a>
        <a href="/#builds">Builds</a>
        <a href="/#experience">Experience</a>
        <a href="/#contact">Contact</a>
        <a class="nav-cv" href="/muaz-husaini-cv.pdf">CV<span class="visually-hidden"> (PDF)</span></a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap lost">
      <div>
        <p class="lost-code">Error 404</p>
        <h1>This page drifted off<span class="sig">.</span></h1>
        <p>Naro went looking and came back with nothing. The address exists, the page behind it does not.</p>
        <a class="lost-back" href="/">Back to the work&nbsp;&#8599;</a>
      </div>
      <img class="adrift" src="assets/mascots/naro-adrift.png" alt="Naro, a voxel astronaut mascot, floating untethered with a worried expression" width="598" height="800">
    </div>
  </main>

  <footer class="dark">
    <div class="wrap site-foot">
      <p>Muaz Husaini. Kuala Lumpur, Malaysia.</p>
    </div>
  </footer>
</body>
</html>
